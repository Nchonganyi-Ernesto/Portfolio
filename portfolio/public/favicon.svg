<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 72" width="100%" height="100%">
  <defs>
    <!-- Cyan Glow Swoosh Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Chrome Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Subtle Drop Shadow for High Legibility on Any Background -->
    <filter id="navLogoGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <style>
      .logo-fill {
        fill: #0f172a;
      }
      .logo-cloud {
        stroke: #334155;
      }
      .logo-pixel-dark {
        fill: #0f172a;
      }
      .logo-pixel-light {
        fill: #64748b;
      }

      /* Seamless Dark Mode Support: Illuminates text/cloud on dark tabs so it never vanishes */
      @media (prefers-color-scheme: dark) {
        .logo-fill {
          fill: #ffffff;
        }
        .logo-cloud {
          stroke: #cbd5e1;
        }
        .logo-pixel-dark {
          fill: #ffffff;
        }
        .logo-pixel-light {
          fill: #94a3b8;
        }
      }
    </style>
  </defs>

  <!-- 100% Transparent Background - Exactly like the original navbar logo -->

  <!-- Full Navbar Logo Group (Cloud Emblem + E-DEV Wordmark) -->
  <g transform="translate(4, 5)" filter="url(#navLogoGlow)">

    <!-- ================================================================= -->
    <!-- 1. LEFT: Cloud Contour + Stylized Italic 'E' + Swoosh & Arrow     -->
    <!-- ================================================================= -->

    <!-- Cloud Outline -->
    <path
      d="M 18 56 
         C 8 56, 3 48, 6 38 
         C 4 28, 12 20, 22 22 
         C 26 10, 44 8, 52 16 
         C 60 14, 68 22, 66 32 
         C 71 38, 69 48, 61 56"
      fill="none"
      class="logo-cloud"
      stroke-width="3.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Digital Tech Pixels floating off the cloud (Top Right) -->
    <rect x="69" y="15" width="4.5" height="4.5" fill="#38bdf8" rx="0.5" />
    <rect x="75" y="15" width="4.5" height="4.5" class="logo-pixel-light" rx="0.5" />
    <rect x="69" y="21" width="4.5" height="4.5" class="logo-pixel-light" rx="0.5" />
    <rect x="75" y="21" width="4.5" height="4.5" class="logo-pixel-dark" rx="0.5" />

    <!-- Stylized Italic 'E' Inside Cloud -->
    <g class="logo-fill">
      <!-- Top Bar of E -->
      <path d="M 26 24 L 50 24 L 46 31 L 24 31 Z" />
      <!-- Middle Bar of E -->
      <path d="M 21 35 L 42 35 L 39 41 L 18 41 Z" />
      <!-- Bottom Bar of E -->
      <path d="M 16 45 L 44 45 L 40 52 L 13 52 Z" />
      <!-- Slanted Spine -->
      <path d="M 26 24 L 13 52 L 18 52 L 31 24 Z" opacity="0.35" />
    </g>

    <!-- Flying Swoosh cutting through the 'E' -->
    <path
      d="M 5 59 C 9 59, 19 51, 31 41 C 41 32, 53 30, 60 28"
      fill="none"
      stroke="url(#swooshGrad)"
      stroke-width="4"
      stroke-linecap="round"
    />
    <!-- Forward Arrow Tip -->
    <polygon points="60,23 68,28 60,33" fill="#38bdf8" />


    <!-- ================================================================= -->
    <!-- 2. RIGHT: The Iconic 'E-DEV' Text (Bold, Sharp, High Contrast)    -->
    <!-- ================================================================= -->
    <g transform="translate(68, 5)">
      <!-- 'E' Letter -->
      <path
        d="M 10 19 L 29 19 L 29 27 L 19 27 L 19 32 L 27 32 L 27 38 L 19 38 L 19 44 L 30 44 L 30 52 L 10 52 Z"
        class="logo-fill"
      />

      <!-- '-' Hyphen (Cyan Accent) -->
      <rect x="34" y="33" width="10" height="5.5" fill="#38bdf8" rx="1.2" />

      <!-- 'D' Letter -->
      <path
        d="M 48 19 L 60 19 C 68 19, 73 25, 73 35.5 C 73 46, 68 52, 60 52 L 48 52 Z M 57 27 L 57 44 C 61.5 44, 63.5 41, 63.5 35.5 C 63.5 30, 61.5 27, 57 27 Z"
        class="logo-fill"
      />

      <!-- 'E' Letter -->
      <path
        d="M 77 19 L 96 19 L 96 27 L 86 27 L 86 32 L 94 32 L 94 38 L 86 38 L 86 44 L 97 44 L 97 52 L 77 52 Z"
        class="logo-fill"
      />

      <!-- 'V' Letter -->
      <path
        d="M 100 19 L 109 19 L 115.5 43 L 122 19 L 131 19 L 121 52 L 110 52 Z"
        class="logo-fill"
      />
    </g>
  </g>
</svg>